name: Update recent repositories

on:
  schedule:
    - cron: "47 6 * * 1"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-recent-repositories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rewrite the list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-recent-repositories.py README.md
      - name: Commit when the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update recently active repositories"
          git push
